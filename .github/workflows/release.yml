name: Build and Release

on:
  push:
    branches:
      - Release

jobs:
  # ─── Validate commit message is a version ───────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version from commit message
        id: check
        run: |
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version=$MSG" >> $GITHUB_OUTPUT
            echo "✓ Valid version: $MSG"
          else
            echo "✗ Commit message '$MSG' is not a valid version (x.x.x)"
            echo "Example: git commit -m '1.0.0'"
            exit 1
          fi

  # ─── macOS builds (arm64 + x86_64) ──────────────────────────────
  build-macos:
    needs: validate
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: xcode-select --install 2>/dev/null || true
      
      - name: Build CLI for Apple Silicon (arm64)
        run: |
          make clean || true
          CFLAGS="-target arm64-apple-macos11" make VERSION=${{ needs.validate.outputs.version }}
          mv dynaserve dynaserve-darwin-arm64
      
      - name: Build CLI for Intel (x86_64)
        run: |
          make clean
          CFLAGS="-target x86_64-apple-macos10.13" make VERSION=${{ needs.validate.outputs.version }}
          mv dynaserve dynaserve-darwin-x86_64
      
      - name: Verify macOS binaries
        run: |
          echo "=== Apple Silicon Binary ==="
          file dynaserve-darwin-arm64
          ls -lh dynaserve-darwin-arm64
          ./dynaserve-darwin-arm64 --version || true
          echo ""
          echo "=== Intel Binary ==="
          file dynaserve-darwin-x86_64
          ls -lh dynaserve-darwin-x86_64
      
      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            dynaserve-darwin-arm64
            dynaserve-darwin-x86_64

  # ─── Linux builds (x86_64 + aarch64) ────────────────────────────
  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make gcc-aarch64-linux-gnu
      
      - name: Build CLI for Linux (x86_64)
        run: |
          make clean || true
          make VERSION=${{ needs.validate.outputs.version }}
          mv dynaserve dynaserve-linux-x86_64
      
      - name: Build CLI for Linux (aarch64)
        run: |
          make clean
          CC=aarch64-linux-gnu-gcc make VERSION=${{ needs.validate.outputs.version }}
          mv dynaserve dynaserve-linux-aarch64
      
      - name: Verify Linux binaries
        run: |
          echo "=== Linux x86_64 Binary ==="
          file dynaserve-linux-x86_64
          ls -lh dynaserve-linux-x86_64
          ./dynaserve-linux-x86_64 --version
          echo ""
          echo "=== Linux aarch64 Binary ==="
          file dynaserve-linux-aarch64
          ls -lh dynaserve-linux-aarch64
      
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dynaserve-linux-x86_64
            dynaserve-linux-aarch64

  # ─── Create release ─────────────────────────────────────────────
  release:
    needs: [validate, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
      
      - name: Organize binaries
        run: |
          mkdir -p release
          mv binaries/macos-binaries/* release/
          mv binaries/linux-binaries/* release/
          chmod +x release/*
          ls -lh release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body: |
            ## Release ${{ needs.validate.outputs.version }}
            
            ### Installation

             **Quick Installer:**
            ```bash
            curl -sSL https://cli.dynaserve.io/install | bash
            ```

            **macOS - Apple Silicon (arm64):**
            ```bash
            curl -L -o dynaserve https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/dynaserve-darwin-arm64
            chmod +x dynaserve && sudo mv dynaserve /usr/local/bin/
            ```

            **macOS - Intel (x86_64):**
            ```bash
            curl -L -o dynaserve https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/dynaserve-darwin-x86_64
            chmod +x dynaserve && sudo mv dynaserve /usr/local/bin/
            ```

            **Linux (x86_64):**
            ```bash
            curl -L -o dynaserve https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/dynaserve-linux-x86_64
            chmod +x dynaserve && sudo mv dynaserve /usr/local/bin/
            ```

            **Linux (aarch64):**
            ```bash
            curl -L -o dynaserve https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.version }}/dynaserve-linux-aarch64
            chmod +x dynaserve && sudo mv dynaserve /usr/local/bin/
            ```
            
            ### Verify Installation
            ```bash
            dynaserve --version
            ```
          
          draft: false
          prerelease: false
          files: |
            release/dynaserve-darwin-arm64
            release/dynaserve-darwin-x86_64
            release/dynaserve-linux-x86_64
            release/dynaserve-linux-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}